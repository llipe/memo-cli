name: CI

on:
  push:
    # release/release/** is excluded: publish.yml already runs its own
    # build+test as part of the publish job, and every commit pushed there
    # was already validated by this same workflow when it landed on main.
    branches-ignore: ['release', 'release/**']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: typecheck / lint / test / build / audit
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['24']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
