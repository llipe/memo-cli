# gitleaks configuration for memo-cli.
# Extends the default rule set and adds an allowlist for known
# false positives in documentation artifacts.
[extend]
useDefault = true

# Global allowlist: documents under /workstream contain JSON examples
# (specs, PRDs, plans) with fictitious SHA-256 hashes in fields such as
# `dedupe_key_sha256`. The generic-api-key rule flags them by entropy,
# but they are not real credentials.
[[allowlists]]
description = "Documentation examples in workstream/ with fictitious SHA-256 hashes (not secrets)"
targetRules = ["generic-api-key"]
paths = ['''workstream/.*\.md''']
# Restrict the exception to 64-character hex hashes (SHA-256), so that
# a real secret with a different format in these files is still detected.
regexes = ['''[0-9a-f]{64}''']
